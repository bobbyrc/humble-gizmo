appId: io.bcraig.humblegizmo
productName: Humble Gizmo
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{docs,tasks,test,.github,.superpowers}/**'
  - '!{vitest.config.ts,tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
mac:
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  category: public.app-category.utilities
  artifactName: Humble-Gizmo-mac.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
win:
  target:
    - target: nsis
      arch: x64
  executableName: humble-gizmo
nsis:
  artifactName: Humble-Gizmo-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
linux:
  target:
    - target: AppImage
      arch: x64
  category: Utility
appImage:
  artifactName: Humble-Gizmo.${ext}
npmRebuild: false
publish:
  provider: github
  owner: bobbyrc
  repo: humble-gizmo
